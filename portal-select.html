<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeVerify AI — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2.2">
<script>
  // If this browser already has a valid session, skip the chooser entirely
  // and go straight to the dashboard — this page is only for brand-new or
  // logged-out visitors who haven't told us which portal they belong to yet.
  (function () {
    var token = localStorage.getItem('tv_session_token');
    if (!token) return;
    fetch('/api/auth/session?token=' + encodeURIComponent(token))
      .then(function (res) { return res.json(); })
      .then(function (data) { if (data.valid) window.location.replace('index.html'); })
      .catch(function () {});
  })();
</script>
<style>
  body.welcome-body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, #0f172a, #020617 70%);
    font-family: 'Inter', sans-serif; padding: 24px 0;
  }
  .welcome-wrap { width: 100%; max-width: 640px; text-align: center; }
  .welcome-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 800; color: #f1f5f9; margin: 0 0 8px; }
  .welcome-sub { font-size: 14px; color: #64748b; margin: 0 0 36px; }
  .portal-choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .portal-choice {
    flex: 1; min-width: 240px; background: #0f172acc; border: 1px solid #1e293b;
    border-radius: 16px; padding: 28px 24px; text-decoration: none; display: block;
    transition: border-color .15s;
  }
  .portal-choice:hover { border-color: #38bdf8; }
  .portal-choice-icon { font-size: 32px; margin-bottom: 12px; }
  .portal-choice-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; color: #f1f5f9; margin: 0 0 6px; }
  .portal-choice-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; }
</style>
</head>
<body class="welcome-body">
  <div class="welcome-wrap">
    <h1 class="welcome-title">Welcome to TradeVerify AI</h1>
    <p class="welcome-sub">Choose your portal to continue.</p>
    <div class="portal-choices">
      <a href="exporter-login.html" class="portal-choice">
        <div class="portal-choice-icon">📦</div>
        <div class="portal-choice-title">Exporter Portal</div>
        <div class="portal-choice-desc">Upload shipment documents, manage compliance, and pay invoices as an exporter.</div>
      </a>
      <a href="importer-login.html" class="portal-choice">
        <div class="portal-choice-icon">🚢</div>
        <div class="portal-choice-title">Importer Portal</div>
        <div class="portal-choice-desc">Track incoming shipments, verify documents, and manage your account as an importer.</div>
      </a>
    </div>
  </div>
</body>
</html>
